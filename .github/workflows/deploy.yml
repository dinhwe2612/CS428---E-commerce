name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [CICD-flow]

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs: 
      auth: ${{ steps.filter.outputs.auth }}
      user: ${{ steps.filter.outputs.user }}
      catalog: ${{ steps.filter.outputs.catalog }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}
      notification: ${{ steps.filter.outputs.notification }}
      cart: ${{ steps.filter.outputs.cart }}
      gateway: ${{ steps.filter.outputs.gateway }}
      image: ${{ steps.filter.outputs.image }}
      chatbot: ${{ steps.filter.outputs.chatbot }}
      eureka: ${{ steps.filter.outputs.eureka }}
      recommend: ${{ steps.filter.outputs.recommend }}
    
    steps:
    - uses: actions/checkout@v3
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          auth:
            - 'server/auth-service/**'
          gateway:
            - 'server/gateway/**'
          order:
            - 'server/order-service/**'
          catalog:
            - 'server/catalog-service/**'
          user:
            - 'server/user-service/**'
          payment:
            - 'server/payment-service/**'
          notification:
            - 'server/notification-service/**'
          cart:
            - 'server/cart-service/**'
          image:
            - 'server/image-service/**'
          chatbot:
            - 'server/chatbot-service/**'
          eureka:
            - 'server/eureka-server/**'
          recommend:
            - 'server/recommend-service/**'

  build-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build Docker image
      run: docker build -t hisokaxxzk/auth-service:latest -f server/auth-service/Dockerfile server/
    - name: Push Docker image
      run: docker push hisokaxxzk/auth-service:latest
    - name: Clean up Docker image
      run: docker image rm hisokaxxzk/auth-service:latest

  build-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build Docker image
      run: docker build -t hisokaxxzk/gateway:latest -f server/gateway/Dockerfile server/
    - name: Push Docker image
      run: docker push hisokaxxzk/gateway:latest
    - name: Clean up Docker image
      run: docker image rm hisokaxxzk/gateway:latest

  build-user:
    needs: changes
    if: needs.changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build Docker image
      run: docker build -t hisokaxxzk/user-service:latest -f server/user-service/Dockerfile server/
    - name: Push Docker image
      run: docker push hisokaxxzk/user-service:latest
    - name: Clean up Docker image
      run: docker image rm hisokaxxzk/user-service:latest

  build-catalog:
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build Docker image
      run: docker build -t hisokaxxzk/catalog-service:latest -f server/catalog-service/Dockerfile server/
    - name: Push Docker image
