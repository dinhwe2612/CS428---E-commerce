        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build Docker image
      run: docker build -t hisokaxxzk/notification-service:latest -f server/notification-service/Dockerfile server/
    - name: Push Docker image
      run: docker push hisokaxxzk/notification-service:latest
    - name: Clean up Docker image
      run: docker image rm hisokaxxzk/notification-service:latest

  build-cart:
    needs: changes
    if: needs.changes.outputs.cart == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
