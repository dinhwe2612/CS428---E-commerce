    - name: Clean up Docker image
      run: docker image rm hisokaxxzk/server-eureka-server:latest

  deploy-auth:
    needs: build-auth
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd /home/hisokaxxzk/CS428---E-commerce/server
            docker pull hisokaxxzk/server-auth:latest
            docker tag hisokaxxzk/server-auth:latest server-auth:latest
            docker compose up -d --no-deps auth

