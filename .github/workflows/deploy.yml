name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [CICD-flow]

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs: 
      auth: ${{ steps.check.outputs.auth }}
      user: ${{ steps.check.outputs.user }}
      catalog: ${{ steps.check.outputs.catalog }}
      order: ${{ steps.check.outputs.order }}
      payment: ${{ steps.check.outputs.payment }}
      notification: ${{ steps.check.outputs.notification }}
      cart: ${{ steps.check.outputs.cart }}
      gateway: ${{ steps.check.outputs.gateway }}
      image: ${{ steps.check.outputs.image }}
      eureka: ${{ steps.check.outputs.eureka }}
      shared: ${{ steps.check.outputs.shared }}
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2
    - name: Check changes
      id: check
      run: |
        echo "Checking file changes..."
        git diff --name-only HEAD~1 HEAD > changed_files.txt
        cat changed_files.txt
        
        # Check each service
        if grep -q "^server/auth-service/" changed_files.txt; then
          echo "auth=true" >> $GITHUB_OUTPUT
        else
          echo "auth=false" >> $GITHUB_OUTPUT
        fi
        
        if grep -q "^server/gateway/" changed_files.txt; then
          echo "gateway=true" >> $GITHUB_OUTPUT
        else
          echo "gateway=false" >> $GITHUB_OUTPUT
        fi
        
        if grep -q "^server/user-service/" changed_files.txt; then
          echo "user=true" >> $GITHUB_OUTPUT
        else
          echo "user=false" >> $GITHUB_OUTPUT
        fi
        
        if grep -q "^server/catalog-service/" changed_files.txt; then
          echo "catalog=true" >> $GITHUB_OUTPUT
        else
          echo "catalog=false" >> $GITHUB_OUTPUT
        fi
        
        if grep -q "^server/order-service/" changed_files.txt; then
          echo "order=true" >> $GITHUB_OUTPUT
        else
          echo "order=false" >> $GITHUB_OUTPUT
        fi
        
        if grep -q "^server/payment-service/" changed_files.txt; then
          echo "payment=true" >> $GITHUB_OUTPUT
        else
          echo "payment=false" >> $GITHUB_OUTPUT
        fi
        
        if grep -q "^server/notification-service/" changed_files.txt; then
          echo "notification=true" >> $GITHUB_OUTPUT
        else
          echo "notification=false" >> $GITHUB_OUTPUT
        fi
        
        if grep -q "^server/cart-service/" changed_files.txt; then
          echo "cart=true" >> $GITHUB_OUTPUT
        else
          echo "cart=false" >> $GITHUB_OUTPUT
        fi
        
        if grep -q "^server/image-service/" changed_files.txt; then
          echo "image=true" >> $GITHUB_OUTPUT
        else
          echo "image=false" >> $GITHUB_OUTPUT
        fi
        
        if grep -q "^server/eureka-server/" changed_files.txt; then
          echo "eureka=true" >> $GITHUB_OUTPUT
        else
          echo "eureka=false" >> $GITHUB_OUTPUT
        fi
        
        # Check shared files
        if grep -E "^server/(pom\.xml|docker-compose\.yml|mvnw|\.mvn/)" changed_files.txt; then
          echo "shared=true" >> $GITHUB_OUTPUT
        else
          echo "shared=false" >> $GITHUB_OUTPUT
        fi

  build-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build Docker image
      run: docker build -t hisokaxxzk/server-auth:latest -f server/auth-service/Dockerfile server/
    - name: Push Docker image
      run: docker push hisokaxxzk/server-auth:latest
    - name: Clean up Docker image
      run: docker image rm hisokaxxzk/server-auth:latest

  build-gateway:
