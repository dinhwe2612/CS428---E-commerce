    - name: Push Docker image
      run: docker push hisokaxxzk/recommend-service:latest
    - name: Clean up Docker image
      run: docker image rm hisokaxxzk/recommend-service:latest

  deploy-auth:
    needs: build-auth
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd /home/hisokaxxzk/CS428---E-commerce/server
            docker pull hisokaxxzk/auth-service:latest
            docker compose up -d --build --no-deps auth

  deploy-gateway:
