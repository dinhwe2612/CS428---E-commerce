services:
  auth:
    build: .
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=auth
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/nguhac
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=12345678
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
      - SPRING_DOCKER_COMPOSE_ENABLED=false
      - SERVER_PORT=8081
      - JWT_SECRET=dadawdwaijdmiada41854185
      - JWT_EXPIRATION=86400000
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - auth-network

  mysql:
    image: 'mysql:latest'
    container_name: auth-mysql
    environment:
      - 'MYSQL_DATABASE=nguhac'
      - 'MYSQL_ROOT_PASSWORD=12345678'
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: 'rabbitmq:latest'
    container_name: auth-rabbitmq
    environment:
      - 'RABBITMQ_DEFAULT_PASS=guest'
      - 'RABBITMQ_DEFAULT_USER=guest'
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - auth-network

volumes:
  mysql-data:
  rabbitmq-data:

networks:
  auth-network:
    driver: bridge
