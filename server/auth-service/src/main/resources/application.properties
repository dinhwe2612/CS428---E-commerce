spring.application.name=auth

spring.datasource.url=${GL_DB_URL}
spring.datasource.username=${GL_DB_USERNAME}
spring.datasource.password=${GL_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# (Optional) JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.docker.compose.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# url reset password ui
spring.reset-password.url=${RESET_PASSWORD_URL}

server.port=${SERVER_PORT}