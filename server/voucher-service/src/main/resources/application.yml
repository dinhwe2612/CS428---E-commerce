server:
  port: 8071

spring:
  application:
    name: voucher-service
  datasource:
    url: ${GL_DB_URL:jdbc:mysql://localhost:3306/voucher_db}
    username: ${GL_DB_USERNAME:root}
    password: ${GL_DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: voucher-service
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

services:
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8089}
    timeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

INTERNAL_API_KEY: ${INTERNAL_API_KEY:72357538782F413F4428472B4B62506453} 