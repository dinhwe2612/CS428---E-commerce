spring.application.name=catalog-service

# RabbitMQ Configuration
spring.rabbitmq.host=image-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3

spring.datasource.url= ${GL_DB_URL}
spring.datasource.username=${GL_DB_USERNAME}
spring.datasource.password=${GL_DB_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.drop_source=metadata
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.create_source=metadata
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.scripts.action=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.scripts.create-target=create.sql
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.scripts.drop-target=drop.sql
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor

# Server
server.port=8089

# Logging Configuration
logging.level.root=INFO
logging.level.com.catalog.catalog_service=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Additional Debug Logging
logging.level.com.catalog.catalog_service.service=DEBUG
logging.level.com.catalog.catalog_service.repository=DEBUG
