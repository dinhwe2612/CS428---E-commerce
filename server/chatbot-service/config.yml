version: "3.1"

recipe: default.v1

Configuration for Rasa NLU.
https://rasa.com/docs/rasa/nlu/components/
language: vi

pipeline:
  Enhanced tokenizer for Vietnamese
  - name: WhitespaceTokenizer
  
  Enhanced featurization for better entity extraction
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: "word"
    min_ngram: 1
    max_ngram: 3
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  
  Enhanced intent classification and entity extraction
  - name: DIETClassifier
    epochs: 100
  
  Enhanced entity synonym mapping
  - name: EntitySynonymMapper
  
  Enhanced response selection
  - name: ResponseSelector
    epochs: 100

policies:
  Enhanced rule policy with fallback handling for Rasa 3.x
  - name: RulePolicy
  
  Enhanced memoization policy
  - name: MemoizationPolicy
    max_history: 5
  
  Enhanced transformer policy for complex conversations
  - name: TEDPolicy
    max_history: 5
    epochs: 100

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

cors:
  enabled: true
  origins: ["*"]
  credentials: false 