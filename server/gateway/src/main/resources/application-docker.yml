server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
          filters:
            - PreserveHostHeader
          include-expression: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
        - AddResponseHeader=Access-Control-Allow-Origin, *
    httpserver:
        access-log:
          enabled: true
          format: 'request="%r" status=%s bytes=%B duration=%D remote=%a'
          
  data:
    redis:
      host: redis
      port: 6379

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
    redisratelimiter: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 5
    eureka-service-url-poll-interval-seconds: 5
    eureka-server-connect-timeout-seconds: 5
    eureka-server-read-timeout-seconds: 10
  instance:
    prefer-ip-address: true
    hostname: api-gateway
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    defaultUrl: /v3/api-docs/auth
    urls:
      - name: Auth
        url: /v3/api-docs/auth
      - name: Image
        url: /v3/api-docs/images
      - name: Cart
        url: /v3/api-docs/cart
      - name: Catalog
        url: /v3/api-docs/catalog
      - name: Payment
        url: /v3/api-docs/payment
      - name: User
        url: /v3/api-docs/user
      - name: Order
        url: /v3/api-docs/order
      - name: Notification
        url: /v3/api-docs/notification
