version: '3.8'

services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    env_file:
      - ./eureka-server/.env
    volumes:
      - ./config/eureka/application-docker.yml:/app/config/application-docker.yml
      - ./eureka-server/src:/app/eureka-server/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8085:8085"
    env_file:
      - ./gateway/.env
    volumes:
      - ./config/gateway/application-docker.yml:/app/config/application-docker.yml
      - ./gateway/src:/app/gateway/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservice-network

  auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8041:8081"
    env_file:
      - ./auth-service/.env
    volumes:
      - ./config/auth/application-docker.yml:/app/config/application-docker.yml
      - ./auth-service/src:/app/auth-service/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservice-network

  image-service:
    build:
      context: .
      dockerfile: image-service/Dockerfile
    container_name: image-service
    ports:
      - "8087:8087"
    env_file:
      - ./image-service/.env
    volumes:
      - ./config/image-service/application-docker.yml:/app/config/application-docker.yml
      - image-storage:/app/storage
      - ./image-service/src:/app/image-service/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    depends_on:
      eureka-server:
        condition: service_healthy
      image-rabbitmq:
        condition: service_started
    networks:
      - microservice-network

  redis:
    image: redis:latest
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  image-rabbitmq:
    image: rabbitmq:management
    container_name: image-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: cart-service
    ports:
      - "8088:8088"
    env_file:
      - ./cart-service/.env
    volumes:
      - ./config/cart-service/application-docker.yml:/app/config/application-docker.yml
      - ./cart-service/src:/app/cart-service/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservice-network

volumes:
  image-storage:
  maven-repo:

networks:
  microservice-network:
    driver: bridge