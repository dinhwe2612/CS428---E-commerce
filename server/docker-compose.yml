version: '3.8'

services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./config/eureka/application-docker.yml:/app/config/application-docker.yml
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8085:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./config/gateway/application-docker.yml:/app/config/application-docker.yml
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservice-network
  auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8041:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://auth-db:3306/auth_db
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - RESET_PASSWORD_URL=${RESET_PASSWORD_URL:-http://localhost:8085/reset-password}
    volumes:
      - ./config/auth/application-docker.yml:/app/config/application-docker.yml
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    networks:
      - microservice-network

  image-service:
    build:
      context: .
      dockerfile: image-service/Dockerfile
    container_name: image-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./config/image-service/application-docker.yml:/app/config/application-docker.yml
      - image-storage:/app/storage
    entrypoint: ["/bin/sh", "-c", "mkdir -p /app/storage && chmod 777 /app/storage && java -jar app.jar"]
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservice-network

  auth-db:
    image: mysql:8.0
    container_name: auth-db
    volumes:
      - auth-db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=auth_db
    ports:
      - "3308:3306"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  auth-db-data:
  image-storage:

networks:
  microservice-network:
    driver: bridge 