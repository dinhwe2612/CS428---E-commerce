version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.2
    container_name: es-local
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    mem_limit: 768m
    mem_reservation: 256m
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservice-network

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    env_file:
      - ./eureka-server/.env
    volumes:
      - ./config/eureka/application-docker.yml:/app/config/application-docker.yml
      - ./eureka-server/src:/app/eureka-server/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8085:8085"
    env_file:
      - ./gateway/.env
    volumes:
      - ./config/gateway/application-docker.yml:/app/config/application-docker.yml
      - ./gateway/src:/app/gateway/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservice-network

  auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8041:8081"
    env_file:
      - ./auth-service/.env
    volumes:
      - ./config/auth/application-docker.yml:/app/config/application-docker.yml
      - ./auth-service/src:/app/auth-service/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    depends_on:
      eureka-server:
        condition: service_healthy
      image-rabbitmq:
        condition: service_started
    networks:
      - microservice-network

  image-service:
    build:
      context: .
      dockerfile: image-service/Dockerfile
    container_name: image-service
    ports:
      - "8087:8087"
    env_file:
      - ./image-service/.env
    volumes:
      - ./config/image-service/application-docker.yml:/app/config/application-docker.yml
      - image-storage:/app/storage
      - ./image-service/src:/app/image-service/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    depends_on:
      eureka-server:
        condition: service_healthy
      image-rabbitmq:
        condition: service_started
    networks:
      - microservice-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8088:8088"
    env_file:
      - ./user-service/.env
    volumes:
      - ./config/user-service/application-docker.yml:/app/config/application-docker.yml
      - ./user-service/src:/app/user-service/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    depends_on:
      eureka-server:
        condition: service_healthy
      image-rabbitmq:
        condition: service_started
    networks:
      - microservice-network

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-service
    ports:
      - "8089:8089"
    env_file:
      - ./catalog-service/.env
    volumes:
      - ./config/catalog-service/application-docker.yml:/app/config/application-docker.yml
      - ./catalog-service/src:/app/catalog-service/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
      - SPRING_ELASTICSEARCH_REST_URIS=http://elasticsearch:9200
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      eureka-server:
        condition: service_healthy
      image-rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      order-service:
        condition: service_started
    networks:
      - microservice-network

  redis:
    image: redis:latest
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  image-rabbitmq:
    image: rabbitmq:management
    container_name: image-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: cart-service
    ports:
      - "8090:8090"
    env_file:
      - ./cart-service/.env
    volumes:
      - ./config/cart-service/application-docker.yml:/app/config/application-docker.yml
      - ./cart-service/src:/app/cart-service/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservice-network

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8091:8091"
    env_file:
      - ./order-service/.env
    volumes:
      - ./config/order-service/application-docker.yml:/app/config/application-docker.yml
      - ./order-service/src:/app/order-service/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
      - INTERNAL_API_KEY=72357538782F413F4428472B4B62506453
    depends_on:
      eureka-server:
        condition: service_healthy
      image-rabbitmq:
        condition: service_started
    networks:
      - microservice-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8095:8095"
    env_file:
      - ./notification-service/src/main/resources/.env
    volumes:
      - ./config/notification-service/application-docker.yml:/app/config/application-docker.yml
      - ./notification-service/src:/app/notification-service/src
      - maven-repo:/root/m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
      - INTERNAL_API_KEY=72357538782F413F4428472B4B62506453
    depends_on:
      eureka-server:
        condition: service_healthy
      image-rabbitmq:
        condition: service_started
    networks:
      - microservice-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8092:8092"
    env_file:
      - ./payment-service/.env
    volumes:
      - ./config/payment-service/application-docker.yml:/app/config/application-docker.yml
      - ./payment-service/src:/app/payment-service/src
      - maven-repo:/root/.m2
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_ADD_PROPERTIES=true
    depends_on:
      eureka-server:
        condition: service_healthy
      image-rabbitmq:
        condition: service_started
    networks:
      - microservice-network

